<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maszx GO - Download Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle, #1b2735, #090a0f);
    color: white;
    text-align: center;
}

header {
    padding: 30px;
    font-size: 28px;
    font-weight: bold;
}

.subtitle {
    color: #aaa;
    margin-bottom: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.platform-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.platform-card {
    background: rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 10px;
    transition: transform 0.2s;
}

.platform-card:hover {
    transform: scale(1.05);
}

.platform-card img {
    width: 48px;
    height: 48px;
}

.download-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    border-radius: 6px;
    text-decoration: none;
    background: #3498db;
    color: white;
    cursor: pointer;
}

.download-btn:hover {
    background: #2980b9;
}

.download-btn.disabled {
    background: gray;
    cursor: not-allowed;
    pointer-events: none;
}

footer {
    margin-top: 40px;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<header>Maszx GO</header>
<div class="subtitle">Download Center</div>

<div class="container">
    <div class="platform-grid" id="platforms"></div>
</div>

<footer>© 2022-2026 MaszxGo Systems</footer>

<script>
// DATA (same as your Express version)
const downloads = [
    {
        name: "Android",
        icon: "https://img.icons8.com/color/48/android-os.png",
        url: "https://www.mediafire.com/file/t6n6er6e9na3zl0/Maszx+GO_1.0.1.apk/file",
        isDownload: false,
    },
    {
        name: "Android - Offline",
        icon: "https://img.icons8.com/color/48/android-os.png",
        url: "https://www.mediafire.com/file/iigz5swq2jobaz4/Maszx+GO+-+Offline_1.0.2.apk/file",
        isDownload: true,
    },
    {
        name: "PC",
        icon: "https://img.icons8.com/fluency/48/windows-11.png",
        url: "",
        isDownload: false,
    },
    {
        name: "macOS",
        icon: "https://img.icons8.com/color/48/mac-os.png",
        url: "",
        isDownload: false,
    }
];

// RENDER FUNCTION
const container = document.getElementById("platforms");

downloads.forEach(p => {
    const card = document.createElement("div");
    card.className = "platform-card";

    card.innerHTML = `
        <img src="${p.icon}" alt="${p.name}">
        <p>${p.name}</p>
        ${
            p.isDownload
            ? `<a class="download-btn" href="${p.url}" target="_blank">Download</a>`
            : `<div class="download-btn disabled">Unavailable</div>`
        }
    `;

    container.appendChild(card);
});
</script>

</body>
</html>
