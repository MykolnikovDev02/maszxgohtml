<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maszx GO - Download Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle, #1b2735, #090a0f);
    color: white;
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 30px;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(6px);
    position: sticky;
    top: 0;
    z-index: 1000;
}

.logo {
    font-size: 20px;
    font-weight: bold;
}

.nav-links a {
    margin-left: 20px;
    text-decoration: none;
    color: white;
    transition: color 0.3s;
}

.nav-links a:hover {
    color: #3498db;
}

/* SECTIONS */
.section {
    padding: 80px 20px;
    text-align: center;
}

.subtitle {
    color: #aaa;
    margin-top: 10px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
}

/* BUTTON */
.cta-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 20px;
    background: #3498db;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.3s;
}

.cta-btn:hover {
    background: #2980b9;
}

/* DOWNLOADS */
.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.platform-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 20px;
}

.platform-card {
    background: rgba(255,255,255,0.08);
    padding: 20px;
    border-radius: 10px;
    transition: transform 0.2s;
}

.platform-card:hover {
    transform: scale(1.05);
}

.platform-card img {
    width: 48px;
    height: 48px;
}

.download-btn {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 15px;
    border-radius: 6px;
    text-decoration: none;
    background: #3498db;
    color: white;
    cursor: pointer;
}

.download-btn:hover {
    background: #2980b9;
}

.download-btn.disabled {
    background: gray;
    cursor: not-allowed;
    pointer-events: none;
}

footer {
    text-align: center;
    margin-top: 40px;
    padding: 20px;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">Maszx GO</div>
    <div class="nav-links">
        <a href="#home">Home</a>
        <a href="#downloads">Downloads</a>
        <a href="https://discord.gg/dRRrpRQhw" target="_blank">Discord</a>
    </div>
</nav>

<!-- HOME -->
<section id="home" class="section">
    <h1>Maszx GO 🚀</h1>
    <p class="subtitle">
        Powerful. Lightweight. Always updated.<br>
        Download the latest version for your device and join our growing community.
    </p>

    <a href="#downloads" class="cta-btn">Get Started</a>
</section>

<!-- DOWNLOADS -->
<section id="downloads" class="section">
    <h2>Download Center</h2>
    <div class="container">
        <div class="platform-grid" id="platforms"></div>
    </div>
</section>

<footer>© 2022-2026 MaszxGo Systems</footer>

<script>
// DATA
const downloads = [
    {
        name: "Android",
        icon: "https://img.icons8.com/color/48/android-os.png",
        url: "https://www.mediafire.com/file/t6n6er6e9na3zl0/Maszx+GO_1.0.1.apk/file",
        isDownload: false,
    },
    {
        name: "Android - Offline",
        icon: "https://img.icons8.com/color/48/android-os.png",
        url: "https://www.mediafire.com/file/iigz5swq2jobaz4/Maszx+GO+-+Offline_1.0.2.apk/file",
        isDownload: true,
    },
    {
        name: "PC",
        icon: "https://img.icons8.com/fluency/48/windows-11.png",
        url: "",
        isDownload: false,
    },
    {
        name: "macOS",
        icon: "https://img.icons8.com/color/48/mac-os.png",
        url: "",
        isDownload: false,
    }
];

// RENDER
const container = document.getElementById("platforms");

downloads.forEach(p => {
    const card = document.createElement("div");
    card.className = "platform-card";

    card.innerHTML = `
        <img src="${p.icon}" alt="${p.name}">
        <p>${p.name}</p>
        ${
            p.isDownload
            ? `<a class="download-btn" href="${p.url}" target="_blank">Download</a>`
            : `<div class="download-btn disabled">Unavailable</div>`
        }
    `;

    container.appendChild(card);
});

// SMOOTH SCROLL
document.querySelectorAll('a[href^="#"]').forEach(anchor => {
    anchor.addEventListener("click", function(e) {
        e.preventDefault();
        document.querySelector(this.getAttribute("href"))
            .scrollIntoView({ behavior: "smooth" });
    });
});
</script>

</body>
</html>
