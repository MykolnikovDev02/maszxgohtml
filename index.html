<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Maszx GO - Download Center</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background: radial-gradient(circle, #0b1220, #020617);
    color: white;
    overflow-x: hidden;
}

/* BACKGROUND */
body::before {
    content: "";
    position: fixed;
    width: 200%;
    height: 200%;
    background: radial-gradient(white 1px, transparent 1px);
    background-size: 50px 50px;
    animation: moveBg 80s linear infinite;
    opacity: 0.05;
    z-index: -1;
}

@keyframes moveBg {
    from { transform: translate(0,0); }
    to { transform: translate(-500px,-500px); }
}

/* NAVBAR */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 30px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(6px);
    align-items: center;
}

.logo {
    font-weight: bold;
    background: linear-gradient(90deg,#3498db,#e74c3c,#2ecc71,#f1c40f);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

/* NAV LINKS LIKE ROUTES */
.nav-links a {
    margin-left: 15px;
    color: white;
    text-decoration: none;
    padding: 6px 10px;
    border-radius: 6px;
    transition: 0.3s;
}

.nav-links a:hover {
    background: #3498db;
}

/* LANGUAGE */
.lang button {
    margin-left: 5px;
    padding: 6px 10px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #222;
    color: white;
}

/* SECTIONS (SPA PAGES) */
.page {
    display: none;
    padding: 80px 20px;
    text-align: center;
    opacity: 0;
    transform: translateY(30px);
    transition: 0.6s ease;
}

.page.active {
    display: block;
    opacity: 1;
    transform: translateY(0);
}

/* TEXT */
.subtitle {
    color: #aaa;
    max-width: 650px;
    margin: auto;
    line-height: 1.6;
}

/* BUTTON */
.cta-btn, .download-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 20px;
    border-radius: 8px;
    text-decoration: none;
    color: white;

    background: linear-gradient(270deg,#3498db,#e74c3c,#2ecc71,#f1c40f);
    background-size: 600% 600%;
    animation: gradientMove 8s ease infinite, glow 3s infinite;
    transition: 0.3s;
}

.cta-btn:hover, .download-btn:hover {
    transform: scale(1.1);
}

/* GRADIENT */
@keyframes gradientMove {
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

/* GLOW */
@keyframes glow {
    0%{box-shadow:0 0 5px #3498db}
    25%{box-shadow:0 0 15px #e74c3c}
    50%{box-shadow:0 0 20px #2ecc71}
    75%{box-shadow:0 0 25px #f1c40f}
    100%{box-shadow:0 0 5px #3498db}
}

/* GRID */
.platform-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(180px,1fr));
    gap: 20px;
    max-width: 900px;
    margin: auto;
}

/* CARD */
.platform-card {
    padding: 20px;
    border-radius: 12px;
    background: linear-gradient(#111,#111) padding-box,
                linear-gradient(90deg,#3498db,#e74c3c,#2ecc71,#f1c40f) border-box;
    border: 1px solid transparent;
    transition: 0.4s;
}

.platform-card:hover {
    transform: translateY(-10px) scale(1.05);
    box-shadow: 0 0 15px #3498db,0 0 15px #e74c3c,0 0 15px #2ecc71,0 0 15px #f1c40f;
}

.platform-card img {
    width: 48px;
    margin-bottom: 10px;
}

/* FOOTER */
footer {
    text-align: center;
    padding: 20px;
    color: #777;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar">
    <div class="logo">Maszx GO</div>

    <div class="nav-links">
        <a href="#/home" onclick="navigate('home')">Home</a>
        <a href="#/download" onclick="navigate('download')">Download</a>
        <a href="#/info" onclick="navigate('info')">Info</a>
    </div>

    <div class="lang">
        <button onclick="setLang('en')">EN</button>
        <button onclick="setLang('ru')">RU</button>
    </div>
</nav>

<!-- HOME -->
<div id="home" class="page active">
    <h1 id="title">Maszx GO 🚀</h1>
    <p class="subtitle" id="desc"></p>
    <a class="cta-btn" onclick="navigate('download')">Get Started</a>
</div>

<!-- DOWNLOAD -->
<div id="download" class="page">
    <h2 id="dlTitle">Download Center</h2>
    <div class="platform-grid" id="platforms"></div>
</div>

<!-- INFO -->
<div id="info" class="page">
    <h2>Information</h2>
    <p class="subtitle">
        Maszx GO is a modern optimized system with fast downloads,
        lightweight UI, and multi-language support (EN / RU / Other).
    </p>
</div>

<footer>© 2022-2026 MaszxGo Systems</footer>

<script>

/* ROUTER SYSTEM (like /home /download) */
function navigate(page){
    document.querySelectorAll(".page").forEach(p=>{
        p.classList.remove("active");
    });

    document.getElementById(page).classList.add("active");
    window.location.hash = page;
}

/* LOAD FROM URL */
if(location.hash){
    navigate(location.hash.replace("#/",""));
}

/* LANGUAGE SYSTEM */
const lang = {
    en:{
        title:"Maszx GO 🚀",
        desc:"Fast, stable and optimized download platform.",
        dl:"Download Center"
    },
    ru:{
        title:"Maszx GO 🚀",
        desc:"Быстрая и стабильная платформа загрузок.",
        dl:"Центр загрузок"
    }
};

function setLang(l){
    document.getElementById("title").innerText = lang[l].title;
    document.getElementById("desc").innerText = lang[l].desc;
    document.getElementById("dlTitle").innerText = lang[l].dl;
}

/* DEFAULT LANGUAGE */
setLang("en");

/* DOWNLOAD DATA */
const downloads = [
    {name:"Android",icon:"https://img.icons8.com/color/48/android-os.png",url:"https://www.mediafire.com/file/c1suz7dv537n855/Maszx_GO_-_Beta_1.0.0.apk/file",isDownload:true},
    {name:"Android Offline",icon:"https://img.icons8.com/color/48/android-os.png",url:"https://www.mediafire.com/file/iigz5swq2jobaz4/Maszx_GO_-_Offline_1.0.2.apk/file",isDownload:true},
    {name:"PC",icon:"https://img.icons8.com/fluency/48/windows-11.png",url:"",isDownload:false},
    {name:"macOS",icon:"https://img.icons8.com/color/48/mac-os.png",url:"",isDownload:false}
];

const container = document.getElementById("platforms");

downloads.forEach(p=>{
    const card=document.createElement("div");
    card.className="platform-card";

    card.innerHTML=`
        <img src="${p.icon}">
        <p>${p.name}</p>
        ${
            p.isDownload
            ? `<a class="download-btn" href="${p.url}">Download</a>`
            : `<div class="download-btn disabled">Unavailable</div>`
        }
    `;

    container.appendChild(card);
});

</script>

</body>
</html>
